[package]
name = "agentcomms-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "agentcomms_desktop"
path = "src/lib.rs"

[[bin]]
name = "agentcomms-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
no-egress-probe = []

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
regex = "1"
time = "0.3"
zeroize = { version = "1", features = ["serde"] }
getrandom = "0.3"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
hex = "0.4"
