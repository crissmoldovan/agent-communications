packages:
  - packages/*
  - apps/*

# One version of each shared tool across every package.
catalog:
  "@biomejs/biome": 2.5.14
  "@types/node": ^22.18.0
  tsdown: 0.23.0
  typescript: 7.0.2
  zod: ^4.6.5

# Supply-chain defaults (pnpm 11): refuse versions younger than a day, and build nothing
# with install scripts unless it is listed here.
minimumReleaseAge: 1440
# esbuild's install script only optimises how its binary is found; pnpm installs the platform binary as an optional
# dependency, so the desktop build works without running it.
allowBuilds: { esbuild: false }
