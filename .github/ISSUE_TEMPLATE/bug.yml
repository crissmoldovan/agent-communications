name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste tokens, client secrets or real email content here. Replace addresses with `someone@example.com`.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command or tool call you ran, and what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `agent-gmail --version`.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options: [CLI, MCP server, Skill, Installation]
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Agent client and version (for MCP or skill problems)
      placeholder: Claude Code 2.1.x, Codex CLI 0.1xx, Cursor …
  - type: textarea
    id: doctor
    attributes:
      label: agent-gmail doctor --json
      description: Contains no secrets. Remove email addresses if you prefer.
      render: json
