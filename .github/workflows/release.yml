name: Release

# Pushing a `v*` tag publishes. It verifies the tagged commit on every platform the packages claim to support, proves
# npm trusts this workflow for every package it is about to send, and then sends them. Nobody approves it in between.
#
# **No credential lives here.** npm trusted publishing mints a short-lived one from this workflow's own identity, so
# there is no token to leak and none to rotate. Do not add one: a long-lived npm token in a public repository is a
# standing risk, and it would also remove the only reason this is allowed to publish at all.
#
# It could not always work this way. npm will not configure a trusted publisher for a package that does not exist,
# so the **first** release of each package has to happen from a maintainer's machine, after which the registry
# knows it and a trusted publisher can be added for this workflow. That was done for core, gmail and gmail-mcp at
# 0.1.1, and `@agentcomms/slack` was first published by hand at 0.4.0. Whether each package's trusted publisher is
# actually configured cannot be read from outside, so the publish job proves it before sending anything: see the
# preflight step. The package list itself lives in `scripts/packages.mjs`; every loop below reads it from there,
# and `test/release-packages.test.mjs` fails if one stops doing so.
#
# **A pushed `v*` tag publishes.** There was a required reviewer on the `release` environment for one release; it
# was removed, because in practice it was opened on instruction rather than as an independent check, and a gate
# that is always opened is worse than none — it reports a control nobody is exercising.
#
# What remains is real rather than ceremonial: the environment accepts `v*` tags and nothing else, the tag must
# match the version the repository declares, six verify legs must pass first, and every published version carries
# provenance naming the commit and the run. The residual risk is stated in docs/RELEASING.md rather than papered
# over: anything that can push a tag to this repository can publish.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Verify and pack, but publish nothing'
        type: boolean
        default: true

permissions: {}

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.18.0, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  publish:
    name: publish to npm
    needs: verify
    if: ${{ inputs.dry-run != true }}
    # Accepts `v*` tags only. It is also one of the claims each package's trusted publisher names, so renaming it
    # fails the OIDC preflight below for every package.
    environment: release
    # Trusted publishing needs a GitHub-hosted runner: a self-hosted one cannot issue an OIDC token npm accepts.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # What authenticates the publish, on its own: no registry credential is set anywhere in this workflow, and
      # none should be added. A grep for one should find nothing, which is why this comment does not name it.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: the tag must be the version the repository declares
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(node -p "require('./package.json').version")
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag v$tag does not match package.json $declared. Run \`pnpm sync:versions\` and commit." >&2
            exit 1
          fi
          node scripts/sync-versions.mjs --check
          # The GitHub release is made from this section after the publish. Missing, it would fail there — with the
          # packages already out. Here it fails with nothing sent.
          node scripts/release-ci.mjs notes "$tag" > /dev/null

      # Provenance is attested against a public source repository; npm refuses it for a private one with a 422 that
      # arrives only after the tarball has been uploaded. Cheaper to find out here.
      - name: provenance needs a public repository
        if: ${{ github.event.repository.private }}
        run: |
          echo "::error::This repository is private, so npm will reject the provenance attestation." >&2
          exit 1

      - run: pnpm build
      - run: pnpm verify:packages

      # **Prove every package trusts this workflow before publishing any.** Trust is configured per package on npm
      # and cannot be read from outside. When it is missing, pnpm only warns "Skipped OIDC" and that one publish is
      # refused — after the packages before it have gone out, leaving a half-published version. This does the same
      # OIDC token exchange the publish does, for each package, and publishes nothing; the tokens it mints are never
      # printed and expire on their own. See `scripts/release-ci.mjs`.
      #
      # Only for the packages the publish below will send. One already at this version from this commit is skipped
      # there, so it is not asked about here, and when every package is — a re-run after the last one landed, or the
      # tag pushed after a local `pnpm release:publish` — there is nothing to prove and this passes. A package at
      # this version from any other commit fails the run here, with nothing sent.
      - name: every package still to publish trusts this workflow (npm OIDC preflight)
        run: node scripts/release-ci.mjs preflight "${GITHUB_REF_NAME#v}" "$GITHUB_SHA"

      # In dependency order: a consumer installing gmail must find the exact core it pins already on the registry.
      #
      # `--tag` is not optional. npm moves `latest` on every publish that does not name another tag, so a
      # `v1.2.3-rc.1` tag would have made a release candidate the version `npm i @agentcomms/gmail` installs — for
      # everybody, immediately. The version validator in `scripts/release.mjs` already accepts a prerelease string,
      # so the script invited exactly the shape the workflow then mishandled.
      #
      # **A package already at this version from this commit is skipped, not re-sent.** npm refuses to publish over a
      # version, so without a skip a re-run after a partial failure stopped at `core` and the only way forward was a
      # new version number. Now a re-run publishes what is missing and finishes the release at the version the tag
      # names. It is also what lets a tag pushed after a local `pnpm release:publish` complete: nothing to send, then
      # confirm and make the GitHub release.
      #
      # **From this commit, not merely at this version.** The skip used to pass anything at the version. A re-run
      # keeps the commit it started with, so after a partial failure that needed a fix the tag was moved, and the
      # next run skipped what the first had built from the old commit and published the rest from the new one: one
      # green version made of two builds. `release-ci.mjs pending` reads the commit each version records and prints
      # only what is left to send; anything at this version from another commit fails it, before the first publish.
      #
      # The commit is recorded by `record-git-head.cjs`, which every publish passes, because pnpm does not record one
      # on its own. An empty list is not an error here — everything is already out — and the confirm step below
      # still asks the registry for every package in `scripts/packages.mjs`.
      - name: publish
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *-*) tag=next ;;
            *)   tag=latest ;;
          esac
          pending=$(node scripts/release-ci.mjs pending "$version" "$GITHUB_SHA")
          if [ -z "$pending" ]; then
            echo "every package is already at $version from this commit; nothing to publish"
          else
            echo "publishing $version under the \"$tag\" dist-tag: $pending"
          fi
          for package in $pending; do
            echo "::group::@agentcomms/$package"
            pnpm --config.pnpmfile=scripts/record-git-head.cjs --filter "@agentcomms/$package" publish --access public --no-git-checks --provenance --tag "$tag"
            echo "::endgroup::"
          done

      # `pnpm --filter` exits 0 when it matches nothing, so a renamed package would publish fewer than this list
      # claims and still finish green. Ask the registry. It is read through a CDN that lags a successful publish by
      # minutes, so this retries rather than concluding from one empty answer — a check that gave up immediately
      # once reported a release that had in fact landed as a total failure.
      #
      # 40 attempts, 15 s apart: ten minutes. Twenty was nearly spent on releases that succeeded — the last package
      # became visible on attempt 11 at 0.3.2, 14 at 0.3.1 and 15 at 0.4.0 — and a timeout here now also skips the
      # GitHub release.
      - name: confirm what reached the registry
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          missing=$(node scripts/packages.mjs)
          [ -n "$missing" ] || { echo "::error::scripts/packages.mjs printed no packages" >&2; exit 1; }
          for attempt in $(seq 1 40); do
            still=""
            for package in $missing; do
              found=$(npm view "@agentcomms/$package@$version" version 2>/dev/null || true)
              if [ "$found" = "$version" ]; then
                echo "  ✓ @agentcomms/$package@$version"
              else
                still="$still $package"
              fi
            done
            missing=$(echo "$still" | xargs || true)
            [ -z "$missing" ] && break
            echo "  … not visible yet:$missing (attempt $attempt)"
            sleep 15
          done
          if [ -n "$missing" ]; then
            echo "::error::not visible after retrying:$missing — check \`npm dist-tag ls\` before assuming it failed" >&2
            exit 1
          fi
          echo "All confirmed at $version."

  # The GitHub release page, made from the changelog section once the registry has confirmed every package. Every
  # release from 0.1.0 to 0.4.0 was made by hand, and 0.3.2's was forgotten for a day. Only for a tag: a manual run
  # has no tag to hang a release on. Idempotent, so re-running the workflow after a partial failure does not trip
  # over a release that already exists.
  github-release:
    name: GitHub release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # To create the release, and nothing else. The publish job keeps `contents: read`.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
      - name: create the release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$GITHUB_REF_NAME already has a release; leaving it as it is."
            exit 0
          fi
          node scripts/release-ci.mjs notes "$version" > "$RUNNER_TEMP/notes.md"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$version" --notes-file "$RUNNER_TEMP/notes.md" $prerelease
