name: Release

# Publishing is the one thing in this repository that cannot be undone: npm keeps a published version for ever, and
# an unpublish window of 72 hours is not a fix once somebody has installed it. So the trigger is a tag a person
# pushes deliberately, every check runs again from a clean checkout before anything is sent, and the packages that
# go out are the ones the tarball-consumer tests just installed and ran.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack and verify without publishing'
        type: boolean
        default: true

permissions: {}

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.18.0, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  publish:
    name: publish to npm
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # Trusted publishing: npm mints a short-lived credential from this token, so no long-lived npm secret exists
      # in this repository to leak, and published versions carry provenance back to this workflow run — provided the
      # repository is public, which the publish job checks before spending anything.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: the tag must be the version the repository says it is
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(node -p "require('./package.json').version")
          if [ "$tag" != "$declared" ]; then
            echo "tag v$tag does not match package.json $declared" >&2
            echo "Run \`pnpm sync:versions\` and commit before tagging." >&2
            exit 1
          fi
          node scripts/sync-versions.mjs --check

      - run: pnpm build
      - run: pnpm verify:packages

      # In lockstep and in dependency order: a consumer that installs gmail must find the core it pins already there.
      #
      # `NODE_AUTH_TOKEN` is a bootstrap and is meant to be deleted. npm refuses to configure a trusted publisher for a
      # package that does not exist, so the *first* publish of each of these three has to authenticate with a token —
      # which is what the v0.1.0 attempt discovered, as an OIDC exchange that 404ed against a package that was not
      # there yet. Once they exist, configure trusted publishing against them, delete this `env:` block, and revoke the
      # secret. How the publish authenticated does not affect provenance — but `id-token: write` is not on its own
      # enough for it either; see the visibility check above.
      # npm will not attest a package whose source repository is private. The attestation is published to the public
      # Sigstore transparency log, so a private repository cannot be its subject, and npm enforces this at the
      # registry rather than in the client: the tarball is built, uploaded, and *then* refused with a 422 naming
      # `repository_visibility`. That arrives at the same point in the run as the auth failures above and reads
      # exactly like one, which is the reason for checking here instead — before a token has been spent and a tag
      # moved. The fix is to make the repository public, not to drop the flag: publishing the first version of a
      # mail-sending toolchain without provenance is a worse trade than waiting.
      - name: provenance requires a public source repository
        if: ${{ inputs.dry-run != true && github.event.repository.private }}
        run: |
          {
            echo "::error::This repository is private, so npm will reject the provenance attestation with a 422."
            echo "Make ${GITHUB_REPOSITORY} public before releasing, or remove --provenance from the publish step"
            echo "and delete the provenance claims in docs/RELEASING.md and the comments in this file."
          } >&2
          exit 1

      - name: publish
        if: ${{ inputs.dry-run != true }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for package in comms-core gmail gmail-mcp; do
            pnpm --filter "@cloudpixel/$package" publish --access public --no-git-checks --provenance
          done

      # `pnpm --filter` exits 0 when it matches nothing — "No projects matched the filters" is not an error. So a
      # renamed package, or a changed scope, would publish fewer packages than this list claims and still finish
      # green; the first person to learn would be a consumer whose install of gmail-mcp cannot resolve the gmail it
      # pins. Ask the registry what is actually there rather than trusting the loop's exit code.
      - name: confirm what actually reached the registry
        if: ${{ inputs.dry-run != true }}
        run: |
          version=$(node -p "require('./package.json').version")
          for package in comms-core gmail gmail-mcp; do
            found=$(npm view "@cloudpixel/$package@$version" version 2>/dev/null || true)
            if [ "$found" != "$version" ]; then
              echo "::error::@cloudpixel/$package@$version is not on the registry, but the publish step succeeded." >&2
              exit 1
            fi
            echo "@cloudpixel/$package@$version confirmed on the registry"
          done

      - name: what would have been published
        if: ${{ inputs.dry-run == true }}
        run: |
          for package in comms-core gmail gmail-mcp; do
            pnpm --filter "@cloudpixel/$package" pack --pack-destination "$RUNNER_TEMP"
          done
          ls -l "$RUNNER_TEMP"
