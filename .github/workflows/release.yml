name: Release checks

# **This workflow does not publish.** Releases are run from a person's machine by `scripts/release.mjs`, so that the
# irreversible step happens where someone can watch it rather than when a tag appears. See .claude/skills/release/.
#
# What it does instead is prove a tagged commit is green on every platform the packages claim to support, so the tag
# carries a public record rather than only somebody's word. Nothing here needs a credential, and nothing here should
# be given one: an npm token in the secrets of a public repository is a worse trade than the provenance a local
# release gives up.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.18.0, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
