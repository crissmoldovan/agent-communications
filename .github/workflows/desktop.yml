{
  "name": "Desktop",
  "on": {
    "push": {
      "paths": [
        "apps/desktop/**",
        ".github/workflows/desktop*.yml",
        "pnpm-lock.yaml",
        "pnpm-workspace.yaml",
        "package.json",
        "test/**",
        "scripts/verify-desktop-mutations.mjs",
        "packages/events/package.json",
        "packages/events-daemon/package.json",
        "scripts/packages.mjs"
      ]
    },
    "pull_request": {
      "paths": [
        "apps/desktop/**",
        ".github/workflows/desktop*.yml",
        "pnpm-lock.yaml",
        "pnpm-workspace.yaml",
        "package.json",
        "test/**",
        "scripts/verify-desktop-mutations.mjs",
        "packages/events/package.json",
        "packages/events-daemon/package.json",
        "scripts/packages.mjs"
      ]
    },
    "workflow_call": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "verify": {
      "name": "Desktop checks",
      "runs-on": "${{ matrix.os }}",
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "os": [
            "macos-latest",
            "windows-latest",
            "ubuntu-latest"
          ]
        }
      },
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "env": {
        "npm_config_registry": "https://registry.npmjs.org/"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "ref": "${{ github.sha }}"
          }
        },
        {
          "uses": "pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86"
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "22.18.0",
            "cache": "pnpm"
          }
        },
        {
          "name": "Assert public registry without credentials",
          "run": "set -euo pipefail\ntest \"$(pnpm config get registry)\" = \"https://registry.npmjs.org/\"\nexport DESKTOP_NPM_USERCONFIG=\"$(pnpm config get userconfig)\"\nexport DESKTOP_NPM_GLOBALCONFIG=\"$(pnpm config get globalconfig)\"\nnode --input-type=module <<'NODE'\nimport { existsSync, readdirSync, readFileSync } from 'node:fs';\nimport { homedir } from 'node:os';\nimport { dirname, join, resolve } from 'node:path';\nconst publicRegistry = 'https://registry.npmjs.org/';\nfor (const [key, value] of Object.entries(process.env)) {\n  if (/(?:node|npm|yarn).*?(?:token|auth|password)/i.test(key)) throw new Error('Registry credentials are forbidden');\n  if (/(?:npm|yarn).*registry/i.test(key) && value !== publicRegistry) throw new Error('Private registry environment is forbidden');\n}\nconst configs = new Set([process.env.DESKTOP_NPM_USERCONFIG, process.env.DESKTOP_NPM_GLOBALCONFIG, join(homedir(), '.npmrc')]);\nfor (let directory = resolve('.');; directory = dirname(directory)) {\n  configs.add(join(directory, '.npmrc'));\n  if (directory === dirname(directory)) break;\n}\nfunction visit(directory) {\n  for (const entry of readdirSync(directory, { withFileTypes: true })) {\n    if (['node_modules', '.git', 'target', 'dist', '.pnpm-store'].includes(entry.name) || entry.isSymbolicLink()) continue;\n    const file = join(directory, entry.name);\n    if (entry.isDirectory()) visit(file);\n    else if (entry.name === '.npmrc') configs.add(file);\n  }\n}\nvisit('.');\nfor (const file of configs) {\n  if (!file || !existsSync(file)) continue;\n  for (const line of readFileSync(file, 'utf8').split(/\\r?\\n/)) {\n    const text = line.trim();\n    if (!text || /^[#;]/.test(text)) continue;\n    if (/auth|token|password|username|cert|keyfile/i.test(text)) throw new Error('Auth-bearing npm configuration is forbidden');\n    const [key, ...rest] = text.split('=');\n    if (/registry/i.test(key) && rest.join('=').trim() !== publicRegistry) throw new Error('Private registry configuration is forbidden');\n  }\n}\nNODE"
        },
        {
          "run": "pnpm install --frozen-lockfile"
        },
        {
          "name": "Linux Tauri system prerequisites",
          "if": "runner.os == 'Linux'",
          "run": "sudo apt-get update\nsudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf xvfb"
        },
        {
          "name": "Rust toolchain",
          "run": "rustup toolchain install stable --profile minimal --component rustfmt --component clippy\nrustup default stable"
        },
        {
          "name": "Frontend gates",
          "run": "pnpm --filter \"./packages/**\" run build\npnpm --filter @agentcomms/desktop build\npnpm --filter @agentcomms/desktop typecheck\npnpm --filter @agentcomms/desktop test\nnode --test test/desktop-workflows.test.mjs apps/desktop/test/release-notes.test.mjs\nnode apps/desktop/test/mutations/run.mjs --group task-3"
        },
        {
          "name": "Rust gates",
          "working-directory": "apps/desktop/src-tauri",
          "run": "cargo fmt --all -- --check\ncargo clippy --all-targets --all-features -- -D warnings\ncargo test --all-targets --all-features"
        },
        {
          "name": "Initial unsigned bundle for content proof",
          "run": "case \"$RUNNER_OS\" in\n  macOS) bundle=app ;;\n  Windows) bundle=nsis ;;\n  Linux) bundle=deb ;;\n  *) exit 1 ;;\nesac\nnode apps/desktop/scripts/bundle-with-evidence.mjs -- pnpm --filter @agentcomms/desktop tauri:build --no-sign --bundles \"$bundle\"\nDESKTOP_BUNDLE_AUDIT=initial node apps/desktop/scripts/bundle-content-graph.mjs"
        },
        {
          "name": "Native desktop proofs (Cargo)",
          "run": "set -euo pipefail\nif [ \"$RUNNER_OS\" = Linux ]; then\n  xvfb-run -a pnpm --filter @agentcomms/desktop test:native\nelse\n  pnpm --filter @agentcomms/desktop test:native\nfi"
        },
        {
          "name": "Unix Task-4 production mutation and Node/Rust control gates",
          "if": "runner.os != 'Windows'",
          "run": "set -euo pipefail\ncargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --example control-probe\nexport DESKTOP_CONTROL_PROBE_BIN=\"$PWD/apps/desktop/src-tauri/target/debug/examples/control-probe\"\nexport DESKTOP_REQUIRE_CONTROL_PROBE=1\nnode --import ./test/helpers/loopback-seal-preload.mjs --experimental-strip-types --disable-warning=ExperimentalWarning --test packages/events-daemon/test/control-server-compat.test.mjs\nnode apps/desktop/test/mutations/run.mjs --group task-4"
        },
        {
          "name": "Windows public pre-read filesystem trap mutation gate",
          "if": "runner.os == 'Windows'",
          "run": "node apps/desktop/test/mutations/run.mjs --case desktop-windows-pre-read-refusal"
        },
        {
          "name": "Bundled actual webview probes against shipped payload",
          "run": "set -euo pipefail\nprobe_root=''\nuninstaller=''\ncleanup() {\n  status=$?\n  trap - EXIT\n  if [ -n \"$uninstaller\" ]; then\n    \"$uninstaller\" /S || status=1\n  fi\n  if [ -n \"$probe_root\" ]; then\n    rm -rf \"$probe_root\"\n  fi\n  exit \"$status\"\n}\ntrap cleanup EXIT\ncase \"$RUNNER_OS\" in\n  macOS) bundle=app; probe=\"apps/desktop/src-tauri/target/release/bundle/macos/Agent Communications.app/Contents/MacOS/agentcomms-desktop\" ;;\n  Windows)\n    bundle=nsis\n    probe_root=\"$(mktemp -d)\"\n    ;;\n  Linux)\n    bundle=deb\n    probe_root=\"$(mktemp -d)\"\n    ;;\n  *) exit 1 ;;\nesac\nVITE_NO_EGRESS_PROBE=1 CARGO_NET_OFFLINE=true node apps/desktop/scripts/bundle-with-evidence.mjs -- pnpm --filter @agentcomms/desktop tauri:build --features no-egress-probe --no-sign --bundles \"$bundle\"\nDESKTOP_BUNDLE_AUDIT=probe node apps/desktop/scripts/bundle-content-graph.mjs\ncase \"$RUNNER_OS\" in\n  Windows)\n    installers=(apps/desktop/src-tauri/target/release/bundle/nsis/*.exe)\n    test \"${#installers[@]}\" -eq 1\n    install_root=\"$(cygpath -w \"$probe_root\")\"\n    \"${installers[0]}\" /S \"/D=$install_root\"\n    probe=\"$probe_root/agentcomms-desktop.exe\"\n    uninstaller=\"$probe_root/uninstall.exe\"\n    test -f \"$uninstaller\"\n    ;;\n  Linux)\n    debs=(apps/desktop/src-tauri/target/release/bundle/deb/*.deb)\n    test \"${#debs[@]}\" -eq 1\n    dpkg-deb -x \"${debs[0]}\" \"$probe_root\"\n    probe=\"$probe_root/usr/bin/agentcomms-desktop\"\n    ;;\nesac\ntest -x \"$probe\"\nexport DESKTOP_PROBE_BINARY=\"$probe\"\nif [ \"$RUNNER_OS\" = Linux ]; then\n  xvfb-run -a pnpm --filter @agentcomms/desktop test:e2e -- --case no-egress\n  xvfb-run -a pnpm --filter @agentcomms/desktop test:e2e -- --case capabilities\n  xvfb-run -a pnpm --filter @agentcomms/desktop test:e2e -- --case full-production\nelse\n  pnpm --filter @agentcomms/desktop test:e2e -- --case no-egress\n  pnpm --filter @agentcomms/desktop test:e2e -- --case capabilities\n  pnpm --filter @agentcomms/desktop test:e2e -- --case full-production\nfi"
        },
        {
          "name": "Unix Task-6 production mutations",
          "if": "runner.os != 'Windows'",
          "run": "node apps/desktop/test/mutations/run.mjs --group task-6"
        },
        {
          "name": "Unsigned production bundle",
          "run": "case \"$RUNNER_OS\" in\n  macOS) bundle=app ;;\n  Windows) bundle=nsis ;;\n  Linux) bundle=deb ;;\n  *) exit 1 ;;\nesac\nnode apps/desktop/scripts/bundle-with-evidence.mjs -- pnpm --filter @agentcomms/desktop tauri:build --no-sign --bundles \"$bundle\"\nDESKTOP_BUNDLE_AUDIT=ordinary node apps/desktop/scripts/bundle-content-graph.mjs"
        },
        {
          "name": "Complete desktop mutation gate",
          "run": "set -euo pipefail\nnode --test --test-reporter=tap test/desktop-workflows.test.mjs test/desktop-release-hold.test.mjs test/desktop-gate-repairs.test.mjs\nnode scripts/verify-desktop-mutations.mjs\nif [ \"$RUNNER_OS\" = Linux ]; then\n  xvfb-run -a node apps/desktop/test/mutations/run.mjs --all\nelse\n  node apps/desktop/test/mutations/run.mjs --all\nfi"
        },
        {
          "name": "Synthetic failure evidence",
          "if": "failure()",
          "uses": "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f",
          "with": {
            "name": "synthetic-evidence-${{ matrix.os }}",
            "path": "apps/desktop/test/evidence/*.json",
            "if-no-files-found": "ignore",
            "retention-days": 3
          }
        }
      ]
    }
  }
}
