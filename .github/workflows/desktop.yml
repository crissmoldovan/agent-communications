name: Desktop

# The desktop app's checks (desktop design DA8), on every pull request that touches it and every push to main that
# does: the UI's typecheck, tests, build and bundle check, the end-to-end tests against the built UI, the Rust gates,
# the licence notices, and an unsigned bundle, on macOS (Apple silicon and Intel), Windows and Linux.
#
# **Nothing secret runs here.** These builds are unsigned and their updater is off: no signing identity, no updater
# key and no token reaches them. The signed macOS release is built on the owner's Mac by
# `apps/desktop/scripts/release-desktop.sh`; see docs/RELEASING.md. `desktop-release.yml` calls this workflow on a
# `desktop-v*` tag before it attaches the Windows and Linux files.
#
# Actions are pinned to the commit of the tag in each comment.

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop*.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      # What the app's checks read from the rest of the repository (a test in apps/desktop holds this list to them).
      - 'scripts/third-party-licenses.mjs'
      - 'scripts/channels.mjs'
      - 'test/helpers/printed-command-guard.mjs'
      - 'packages/core/src/paths.ts'
      - 'packages/core/src/config.ts'
      - 'packages/core/src/ids.ts'
      - 'packages/core/src/name-grammar.ts'
      - 'packages/core/src/operations/label.ts'
      - 'packages/*/package.json'
      - 'capabilities.json'
      - 'README.md'
      - '.gitignore'
      - '.github/workflows/release.yml'
      # The events daemon's half of the Laya contract (E2 Task 11), which the app's tests and Rust tests read, and the
      # runner, fragments and child of E2's Rust mutants, which the Laya Rust mutants step runs.
      - 'packages/events-daemon/test/fixtures/judges/desktop-contract-v1.json'
      - 'packages/events-daemon/test/fixtures/laya/cases/**'
      - 'packages/events-daemon/test/support/laya-mutants.ts'
      - 'packages/events-daemon/test/support/run-laya-mutants.ts'
      - 'packages/events-daemon/test/support/strict-mutation-child.ts'
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop*.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      # What the app's checks read from the rest of the repository (a test in apps/desktop holds this list to them).
      - 'scripts/third-party-licenses.mjs'
      - 'scripts/channels.mjs'
      - 'test/helpers/printed-command-guard.mjs'
      - 'packages/core/src/paths.ts'
      - 'packages/core/src/config.ts'
      - 'packages/core/src/ids.ts'
      - 'packages/core/src/name-grammar.ts'
      - 'packages/core/src/operations/label.ts'
      - 'packages/*/package.json'
      - 'capabilities.json'
      - 'README.md'
      - '.gitignore'
      - '.github/workflows/release.yml'
      # The events daemon's half of the Laya contract (E2 Task 11), which the app's tests and Rust tests read, and the
      # runner, fragments and child of E2's Rust mutants, which the Laya Rust mutants step runs.
      - 'packages/events-daemon/test/fixtures/judges/desktop-contract-v1.json'
      - 'packages/events-daemon/test/fixtures/laya/cases/**'
      - 'packages/events-daemon/test/support/laya-mutants.ts'
      - 'packages/events-daemon/test/support/run-laya-mutants.ts'
      - 'packages/events-daemon/test/support/strict-mutation-child.ts'
  workflow_call: {}

permissions:
  contents: read

jobs:
  checks:
    name: desktop (${{ matrix.os }}, ${{ matrix.bundles }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Every leg finishes, so one failing platform does not hide the others' results.
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, bundles: app }
          - { os: macos-15-intel, bundles: app }
          - { os: windows-latest, bundles: nsis }
          - { os: ubuntu-22.04, bundles: deb }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter '!@agentcomms/events-laya-runtime'

      - name: Linux system packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf xvfb
      - name: Rust toolchain, as apps/desktop/src-tauri/rust-toolchain.toml pins it
        working-directory: apps/desktop/src-tauri
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy

      - name: UI typecheck, tests, build and bundle check
        run: |
          pnpm --filter @agentcomms/desktop typecheck
          pnpm --filter @agentcomms/desktop test
          pnpm --filter @agentcomms/desktop build
          pnpm --filter @agentcomms/desktop check:bundle
      - name: End-to-end tests against the built UI
        run: |
          pnpm --filter @agentcomms/desktop exec playwright install --with-deps chromium
          pnpm --filter @agentcomms/desktop test:e2e
      - name: Rust format, lints and tests
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      # E2's paired Rust mutants (E2 Task 11): each is one exact edit to a copy of the app's crate, and its one named unit
      # test, run alone, must build, run and fail. The runner first proves it refuses a copy that does not build, an
      # oracle that does not pass unmutated and a surviving mutant. `pnpm verify` builds no Rust, so they run here.
      - name: Laya Rust mutants
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning packages/events-daemon/test/support/run-laya-mutants.ts --leg cargo
      # THIRD_PARTY_LICENSES must name what this commit's build is made of: every package the web bundle includes and
      # every crate cargo resolves for the four targets. It fails, naming each one, when the file is out of step.
      - name: Licence notices
        run: pnpm --filter @agentcomms/desktop check:licenses
      - name: Unsigned bundle
        run: pnpm --filter @agentcomms/desktop tauri build --ci --no-sign --bundles ${{ matrix.bundles }}
